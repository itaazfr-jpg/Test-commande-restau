<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commande en famille</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Commande">
<meta name="theme-color" content="#F3F5EF">
<style>
:root{
  --paper:#F3F5EF; --card:#FFFFFF; --ink:#1B2540; --muted:#5D6578; --line:#D7DBD0;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --soft:#E2EEE5; --hl:#F2C14E; --warn-bg:#FBEFD6; --warn-ink:#6B4B07;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151D; --card:#1A202C; --ink:#ECEFF4; --muted:#9BA4B6; --line:#2B3343;
    --accent:#62B48C; --accent-ink:#0C1A12; --soft:#1C3127; --hl:#E7B43C; --warn-bg:#3A2F17; --warn-ink:#F3DCA6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151D; --card:#1A202C; --ink:#ECEFF4; --muted:#9BA4B6; --line:#2B3343;
  --accent:#62B48C; --accent-ink:#0C1A12; --soft:#1C3127; --hl:#E7B43C; --warn-bg:#3A2F17; --warn-ink:#F3DCA6;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{max-width:560px;margin:0 auto;padding:16px 16px 130px}
h2{font-size:1.75rem;line-height:1.1;font-weight:800;letter-spacing:-.015em;margin:.4em 0 .25em}
p{margin:.2em 0 1em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;width:100%;min-height:42vh;resize:vertical;line-height:1.5}
textarea::placeholder{color:var(--muted);opacity:.8}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:16px 18px;border-radius:14px;font-weight:700;font-size:1.05rem;text-align:center}
.primary{background:var(--accent);color:var(--accent-ink)}
.secondary{background:var(--card);border:1.5px solid var(--line)}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:10px 4px;font-weight:600;align-self:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .link{padding:10px 0}
.how{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.how ol{margin:0;padding-left:1.3em}
.how li{margin:3px 0}
.how b{font-weight:700}
.status{min-height:1.4em;margin:8px 2px 0;font-weight:600;color:var(--accent)}
.offline{font-size:.88rem;color:var(--muted);text-align:center;margin-top:14px}
.offline.ok{color:var(--accent);font-weight:600}
.status.warn{color:var(--warn-ink)}

.cat{margin-top:20px}
.cath{font-weight:800;font-size:1.05rem;padding-bottom:5px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;margin:8px 0}
.item.on{border-color:var(--accent);background:var(--soft)}
.name{flex:1;min-width:0;cursor:pointer;padding:6px 0}
.name b{display:block;font-size:1.1rem;line-height:1.25}
.name small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3;margin-top:2px}
.step{flex:none;display:flex;align-items:center;gap:4px}
.step button{width:48px;height:48px;border-radius:50%;font-size:1.6rem;font-weight:600;line-height:1;border:1.5px solid var(--line);background:var(--card)}
.step button.plus{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q{min-width:1.8ch;text-align:center;font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:528px;margin:0 auto;display:flex;gap:12px;align-items:center}
.cnt{flex:none;font-weight:800;font-size:1.1rem;min-width:4.5em}
.cnt small{display:block;font-weight:500;font-size:.8rem;color:var(--muted)}

.ticket{position:relative;background:var(--card);border-radius:14px 14px 0 0;padding:18px 18px 22px;margin:10px 0 28px}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:radial-gradient(circle at 9px 10px,transparent 6.5px,var(--card) 7px) repeat-x;background-size:18px 10px}
.tcat+.tcat{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--line)}
.tcath{font-weight:700;font-size:.95rem;color:var(--accent);margin-bottom:2px}
.trow{display:flex;gap:16px;align-items:baseline;padding:7px 0}
.trow .n{flex:none;min-width:2ch;font-size:2.1rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.trow b{font-size:1.3rem;line-height:1.2}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[^\p{L}\p{N}]/gu,'');
const cap = s => { s = s.toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
const CONNECT = /(^|\s)(de|du|des|d’|d'|la|le|les|l’|l'|à|au|aux|et|ou|avec|en|sur|sans|par|pour|un|une)$/i;
const ICON = /[\u2600-\u27BF\u{1F300}-\u{1FAFF}\uE000-\uF8FF]/u;
const LETTER_MARK = /(?:\s+[FLfl]){1,3}\s*$/;
function tidy(l){
  return l.replace(/[\u2600-\u27BF\u{1F300}-\u{1FAFF}\uE000-\uF8FF\uFE0F\u2022\u00B7]/gu,' ')
    .replace(/^[^\p{L}\p{N}(«"]+/u,'').replace(/[^\p{L}\p{N})»".!:,]+$/u,'').replace(/\s+/g,' ').trim();
}
function isHeading(l){
  const letters = l.replace(/[^\p{L}]/gu,''); if (letters.length < 3 || l.length > 40) return false;
  return letters.replace(/[^\p{Lu}]/gu,'').length / letters.length >= 0.85;
}
function junk(l){
  return !l || /^[\d\s%:.,h]+$/i.test(l) || /cam[ée]ra$/i.test(l) || /\b\d+\s*sur\s*\d+\b/i.test(l)
    || /(https?:|www\.|\.(it|com|fr|net|org)\b)/i.test(l) || /€|\$|£|\d+[.,]\d{2}\b/.test(l)
    || /^vari(ety|[ée]t[ée])\s*:/i.test(l) || /^destination dish\b/i.test(l) || /^(du|par le) chef\b/i.test(l);
}
function splitName(t){
  t = t.replace(/[\s.:,]+$/,'');
  const low = t.toLowerCase();
  const idx = [t.indexOf(':'), t.indexOf(','), low.indexOf(' avec '), low.indexOf(' servi'), low.indexOf(' accompagn')].filter(i => i >= 4);
  if (!idx.length) return t;
  const cut = Math.min(...idx);
  const name = t.slice(0,cut).trim(), detail = t.slice(cut).replace(/^[\s:,]+/,'').trim();
  return detail ? name + ' — ' + detail : name;
}
function cleanPaste(raw){
  // 1) Découpe en lignes utiles : rubriques et lignes de texte (avec repère d’icône ❄/🍃, que Texte en direct lit souvent « F » ou « L »)
  const toks = []; let somm = false, skip = false;
  for (const r of raw.split(/\r?\n/)) {
    let marker = ICON.test(r.replace(/[\s\uFE0F]+$/,'').slice(-3));
    let l = tidy(r);
    if (/sommelier/i.test(l)) { somm = true; continue; }
    if (somm) { if (/€|\$|£|\d+[.,]\d{2}/.test(r)) somm = false; continue; }
    if (junk(l)) continue;
    if (isHeading(l)) {
      skip = /APPARIEMENT|\bVINS?\b|\bWINES?\b|\bCOCKTAILS?\b/i.test(l);
      if (!skip) toks.push({ h: cap(l.replace(/[\s:]+$/,'')) });
      continue;
    }
    if (skip) continue;
    if (LETTER_MARK.test(l)) { marker = true; l = l.replace(LETTER_MARK,'').trim(); }
    if (l) toks.push({ text: l, marker });
  }
  // 2) Une rubrique « à repères » : au moins un plat y finit par une icône
  const maxLen = Math.max(1, ...toks.filter(t => t.text).map(t => t.text.length));
  let seg = { marks:false }; const segs = [seg];
  for (const t of toks) { if (t.h) { seg = { marks:false }; segs.push(seg); } else if (t.marker) seg.marks = true; t.seg = seg; }
  // 3) Recolle les lignes d’un même plat
  const cats = []; let cat = null, cur = null;
  const flush = () => {
    if (cur && !cur.orphan) {
      const t = cur.text.trim();
      if (t.length >= 3 && !/[.!?]$/.test(t)) {
        if (!cat) { cat = { name:'', items:[] }; cats.push(cat); }
        cat.items.push(splitName(t));
      }
    }
    cur = null;
  };
  for (const t of toks) {
    if (t.h) {
      flush();
      cat = cats.find(c => norm(c.name) === norm(t.h)) || null;
      if (!cat) { cat = { name:t.h, items:[] }; cats.push(cat); }
      continue;
    }
    const l = t.text;
    let cont = false;
    if (cur) {
      const prev = cur.last;
      if (cur.ended || /[.!?]$/.test(prev)) cont = false;
      else if (/^[\p{Ll}(«"]/u.test(l) || /[:,]$/.test(prev) || CONNECT.test(prev)) cont = true;
      else if (t.seg.marks) cont = prev.length >= 0.8 * maxLen;
    }
    if (cont) { cur.text += ' ' + l; cur.last = l; cur.ended = t.marker; continue; }
    flush();
    cur = { text:l, last:l, ended:t.marker, orphan: /^\p{Ll}/u.test(l) };
  }
  flush();
  return cats.filter(c => c.items.length);
}

const $app = document.getElementById('app');
const KEY = 'commande-famille-v2';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plats = n => n + (n > 1 ? ' plats' : ' plat');

let S = (() => {
  try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && typeof r.text === 'string') return r; } catch (e) {}
  return { screen:'menu', text:'', counts:{} };
})();
let armed = null, statusMsg = '', statusWarn = false, offlineReady = false;
function markOffline(){
  offlineReady = true;
  const el = document.getElementById('offline');
  if (el) { el.textContent = '✓ Prête à fonctionner hors ligne'; el.className = 'offline ok'; }
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.ready.then(markOffline).catch(() => {});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// Format de la liste : une ligne = un plat (« Nom — détails »), une ligne qui finit par « : » = une rubrique.
function parse(text){
  const cats = []; let cur = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    if (/:\s*$/.test(line)) { cur = { name: line.replace(/\s*:\s*$/, ''), items: [] }; cats.push(cur); continue; }
    if (!cur) { cur = { name:'', items:[] }; cats.push(cur); }
    const k = line.indexOf(' — ');
    const name = (k > 0 ? line.slice(0, k) : line).trim();
    const detail = k > 0 ? line.slice(k + 3).trim() : '';
    if (!cur.items.some(i => i.name === name)) cur.items.push({ name, detail, line });
  }
  return cats;
}
function rank(n){
  n = norm(n);
  if (!n) return 0;
  if (/entree|antipast|starter/.test(n)) return 1;
  if (/premier|primi/.test(n)) return 2;
  if (/principa|second|resistance/.test(n)) return 3;
  if (/classique|alternati/.test(n)) return 6.5;
  if (/fromage/.test(n)) return 5;
  if (/dessert|dolci/.test(n)) return 6;
  if (/boisson/.test(n)) return 7;
  return 4.5;
}
function serialize(cats){
  return cats.filter(c => c.items.length || c.name)
    .map(c => (c.name ? c.name + ' :\n' : '') + c.items.map(i => i.line).join('\n')).join('\n\n');
}
function mergePaste(existingText, newCats){
  const cats = parse(existingText).map(c => ({ name:c.name, items:c.items.map(i => ({ name:i.name, line:i.line })) }));
  let added = 0;
  for (const nc of newCats) {
    let target = nc.name ? cats.find(c => norm(c.name) === norm(nc.name)) : cats[cats.length - 1];
    if (!target) { target = { name:nc.name, items:[] }; cats.push(target); }
    for (const line of nc.items) {
      const k = line.indexOf(' — '); const name = k > 0 ? line.slice(0, k) : line;
      const all = cats.flatMap(c => c.items);
      if (all.some(i => norm(i.name) === norm(name))) continue;
      target.items.push({ name, line }); added++;
    }
  }
  cats.sort((a, b) => rank(a.name) - rank(b.name));
  return { text: serialize(cats), added };
}
const allNames = () => parse(S.text).flatMap(c => c.items.map(i => i.name));
const total = () => allNames().reduce((a, n) => a + (S.counts[n] || 0), 0);

function menu(){
  return `
    <h2>Le menu du jour</h2>
    <div class="how"><ol>
      <li>Ouvre ta capture du menu dans <b>Photos</b>.</li>
      <li>Appuie sur l’icône <b>Texte en direct</b> (en bas à droite), puis <b>Tout copier</b>.</li>
      <li>Reviens ici et colle dans la zone ci-dessous. Recommence pour chaque capture.</li>
    </ol></div>
    <textarea id="txt" placeholder="Colle le texte du menu ici, ou écris un plat par ligne." autocapitalize="sentences" spellcheck="false">${esc(S.text)}</textarea>
    <div class="status${statusWarn ? ' warn' : ''}" id="status" role="status">${esc(statusMsg)}</div>
    <div class="stack"><button class="btn secondary" data-a="clear">${armed === 'clear' ? 'Appuie encore pour tout effacer' : 'Effacer le menu (nouveau repas)'}</button></div>
    <div class="offline${offlineReady ? ' ok' : ''}" id="offline">${offlineReady ? '✓ Prête à fonctionner hors ligne' : 'Préparation du mode hors ligne…'}</div>
    <div class="dock"><div class="in"><button class="btn primary" data-a="ok">C’est bon, on choisit</button></div></div>`;
}

function itemRow(it){
  const q = S.counts[it.name] || 0;
  return `<div class="item${q ? ' on' : ''}" data-row="${esc(it.name)}">
    <div class="name" data-a="tap" data-n="${esc(it.name)}"><b>${esc(it.name)}</b>${it.detail ? `<small>${esc(it.detail)}</small>` : ''}</div>
    <div class="step">
      <button data-a="minus" data-n="${esc(it.name)}" aria-label="Un de moins : ${esc(it.name)}" ${q ? '' : 'disabled'}>−</button>
      <span class="q" aria-live="polite">${q}</span>
      <button class="plus" data-a="plus" data-n="${esc(it.name)}" aria-label="Un de plus : ${esc(it.name)}">+</button>
    </div></div>`;
}
function findItem(name){ for (const c of parse(S.text)) for (const i of c.items) if (i.name === name) return i; return null; }

function choix(){
  const t = total();
  return `
    <div class="top"><h2>Chacun choisit</h2><button class="link" data-a="edit">Modifier le menu</button></div>
    <p>Appuie sur + pour chaque plat que tu prends, puis passe le téléphone au suivant.</p>
    ${parse(S.text).filter(c => c.items.length).map(c => `<section class="cat">${c.name ? `<div class="cath">${esc(c.name)}</div>` : ''}${c.items.map(itemRow).join('')}</section>`).join('')}
    <div class="stack"><button class="btn secondary" data-a="reset">${armed === 'reset' ? 'Appuie encore pour remettre à zéro' : 'Remettre les choix à zéro'}</button></div>
    <div class="dock"><div class="in">
      <span class="cnt" id="cnt">${plats(t)}<small>au total</small></span>
      <button class="btn primary" data-a="serveur" ${t ? '' : 'disabled'}>Le serveur arrive</button>
    </div></div>`;
}

function serveur(){
  const blocks = parse(S.text).map(c => {
    const rows = c.items.filter(i => S.counts[i.name]);
    if (!rows.length) return '';
    return `<div class="tcat">${c.name ? `<div class="tcath">${esc(c.name)}</div>` : ''}
      ${rows.map(i => `<div class="trow"><span class="n">${S.counts[i.name]}</span><b>${esc(i.name)}</b></div>`).join('')}</div>`;
  }).join('');
  return `
    <h2>La commande</h2>
    <p>${plats(total())} au total.</p>
    <div class="ticket">${blocks || '<div class="empty">Rien n’a encore été choisi.</div>'}</div>
    <div class="stack">
      <button class="btn secondary" data-a="back">Retour aux choix</button>
      <button class="btn secondary" data-a="reset">${armed === 'reset' ? 'Appuie encore pour remettre à zéro' : 'Commande passée, remettre à zéro'}</button>
    </div>`;
}

function render(){ $app.innerHTML = ({ menu, choix, serveur }[S.screen] || menu)(); }
function go(s){ S.screen = s; armed = null; statusMsg = ''; save(); render(); window.scrollTo(0, 0); }
function setStatus(msg, warn){
  statusMsg = msg; statusWarn = !!warn;
  const el = document.getElementById('status');
  if (el) { el.textContent = msg; el.className = 'status' + (warn ? ' warn' : ''); }
}

function updateRow(name){
  const el = [...document.querySelectorAll('[data-row]')].find(e => e.dataset.row === name);
  const it = findItem(name);
  if (el && it) el.outerHTML = itemRow(it);
  const t = total(); const c = document.getElementById('cnt');
  if (c) c.innerHTML = plats(t) + '<small>au total</small>';
  const b = document.querySelector('[data-a="serveur"]'); if (b) b.disabled = !t;
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, n = b.dataset.n;
  if (a !== 'reset' && a !== 'clear') armed = null;
  switch (a) {
    case 'ok': {
      const ta = document.getElementById('txt'); S.text = ta.value;
      if (!allNames().length) { setStatus('Colle d’abord le texte du menu (ou écris au moins un plat).', true); ta.focus(); return; }
      const names = new Set(allNames());
      for (const k of Object.keys(S.counts)) if (!names.has(k)) delete S.counts[k];
      go('choix'); break;
    }
    case 'clear':
      if (armed !== 'clear') { armed = 'clear'; S.text = document.getElementById('txt').value; render(); return; }
      armed = null; S.text = ''; S.counts = {}; save(); statusMsg = ''; render(); break;
    case 'edit': go('menu'); break;
    case 'tap': if (S.counts[n]) return;
    case 'plus': S.counts[n] = (S.counts[n] || 0) + 1; save(); updateRow(n); break;
    case 'minus': S.counts[n] = Math.max(0, (S.counts[n] || 0) - 1); if (!S.counts[n]) delete S.counts[n]; save(); updateRow(n); break;
    case 'serveur': go('serveur'); break;
    case 'back': go('choix'); break;
    case 'reset':
      if (armed !== 'reset') { armed = 'reset'; render(); return; }
      S.counts = {}; go('choix'); break;
  }
});
$app.addEventListener('input', e => { if (e.target.id === 'txt') { S.text = e.target.value; save(); } });
$app.addEventListener('paste', e => {
  if (e.target.id !== 'txt') return;
  const raw = (e.clipboardData || window.clipboardData)?.getData('text') || '';
  const cats = cleanPaste(raw);
  const count = cats.reduce((a, c) => a + c.items.length, 0);
  if (count < 2) return; // texte court tapé à la main : collage normal
  e.preventDefault();
  const ta = e.target;
  const { text, added } = mergePaste(ta.value, cats);
  ta.value = text; S.text = text; save();
  setStatus(added ? `✓ ${plats(added)} ajouté${added > 1 ? 's' : ''}. Colle la capture suivante, ou vérifie la liste.` : 'Ces plats étaient déjà dans la liste.');
});

render();
</script>
</body>
</html>
